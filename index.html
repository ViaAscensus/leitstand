<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitstand</title>
<style>
/*
  Leitwarte / control-room panel: a status strip of live counters across
  the top, projects below as short instrument tiles in a wrapping grid;
  clicking one opens a dedicated detail panel with the full record, its
  next steps now individual rows instead of one block of text.
  Deliberately single dark theme: a control room is dark by trade, not
  by default.
*/
:root{
  --bg:#0a0e13;
  --panel:#121922;
  --panel-2:#0d1319;
  --border:#223040;
  --fg:#e7edf3;
  --muted:#80909f;
  --accent:#45d6c4;
  --accent-dim:rgba(69,214,196,.16);
  --s-offen:#6b7a8f;
  --s-arbeit:#5b9dff;
  --s-wartet:#f2b84b;
  --s-erledigt:#43c98a;
  --s-pausiert:#c4713f;
  --sand:#d8b878;
  --sand-dim:rgba(216,184,120,.10);
  --sand-border:rgba(216,184,120,.32);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  padding:0 20px;
}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 0 60px}

.topbar{
  display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
  justify-content:space-between;margin-bottom:28px;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px 2px var(--accent-dim);flex:none}
.brand h1{
  font-size:1.3rem;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;margin:0;white-space:nowrap;
}
.brand .sub{color:var(--muted);font-size:.8rem;margin:0}
.topright{display:flex;align-items:center;gap:14px}
.clock{
  font-family:'IBM Plex Mono',monospace;color:var(--muted);
  font-size:.82rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;
}
.clock b{color:var(--fg);font-weight:500}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.stat{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;min-width:108px;flex:1 1 108px;
}
.stat .n{
  font-family:'IBM Plex Mono',monospace;font-size:1.5rem;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.1;
}
.stat .l{color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.toolbar h2{font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0}
button{
  font-family:inherit;border:1px solid var(--border);background:var(--panel);
  color:var(--fg);border-radius:8px;padding:8px 14px;font-size:.85rem;cursor:pointer;
}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:#06211c;border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button.link{background:transparent;border-color:transparent;color:var(--accent);padding:4px 0;font-weight:500}
button.link:hover{text-decoration:underline;border-color:transparent}
button.danger{border-color:var(--s-pausiert);color:var(--s-pausiert);background:transparent}
button.danger:hover{background:rgba(196,113,63,.12)}
button.small{padding:5px 10px;font-size:.78rem}
button[disabled]{opacity:.45;cursor:default}

.grid{
  display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
}
.card{
  background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--s-offen);
  border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;
}
.card .cardtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{margin:0;font-size:1rem;font-weight:600;word-wrap:break-word;cursor:pointer}
.card h3:hover{color:var(--accent)}
.card .field-label{color:var(--muted);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;margin:0 0 3px}

.bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.bullets li{display:flex;gap:8px;font-size:.88rem;line-height:1.5;word-wrap:break-word}
.bullets li::before{content:"•";color:var(--accent);flex:none}
.card .bullets{font-size:.84rem;color:var(--muted)}
.more{margin:0;color:var(--muted);font-size:.78rem;font-style:italic}
.empty-hint{margin:0;color:var(--muted);font-size:.84rem;font-style:italic}

.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:4px 10px 4px 8px;font-size:.74rem;font-weight:500;border:1px solid var(--border);
  background:var(--panel-2);width:fit-content;flex:none;
}
.pill .sw{width:8px;height:8px;border-radius:50%;flex:none}
select.statusselect{
  font-family:inherit;background:var(--panel-2);color:var(--fg);border:1px solid var(--border);
  border-radius:999px;padding:4px 10px;font-size:.74rem;cursor:pointer;
}

.claudetag{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:3px 9px;font-size:.68rem;font-weight:500;background:var(--accent-dim);color:var(--accent);flex:none;
}
.claudebox{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--accent-dim);border:1px solid var(--accent);border-radius:8px;
  padding:10px 14px;margin-bottom:18px;font-size:.85rem;
}
.claudebox span{color:var(--fg)}

.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px;border-top:1px solid var(--border);padding-top:10px}
.ts{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:.7rem;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:6px;flex:none}

textarea,input.textin{
  font-family:inherit;background:var(--panel-2);color:var(--fg);border:1px solid var(--border);
  border-radius:8px;padding:8px;font-size:.88rem;width:100%;resize:vertical;
}
textarea{min-height:64px;line-height:1.5}
.formrow{display:flex;flex-direction:column;gap:4px}
.formactions{display:flex;gap:8px;justify-content:flex-end}

.empty{
  border:1px dashed var(--border);border-radius:10px;padding:40px 20px;text-align:center;
  color:var(--muted);
}
.empty b{color:var(--fg);display:block;margin-bottom:6px;font-size:1rem}

.offline{color:var(--s-wartet);font-size:.85rem;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:16px}

.detailpanel{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--s-offen);border-radius:12px;padding:22px;max-width:760px}
.detailback{margin-bottom:16px}
.detailhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
.detailhead h2{margin:0;font-size:1.4rem;font-weight:600;min-width:0;word-wrap:break-word}
.detailsection{margin-bottom:18px}
.detailsection .field-label{color:var(--muted);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;margin:0 0 6px}
.detailsection .bullets{gap:13px}
.detailsection .bullets li{font-size:.95rem;line-height:1.6}
.detailfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;border-top:1px solid var(--border);padding-top:14px;flex-wrap:wrap}

.attachlist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.attachlist:empty{margin-bottom:0}
.attachrow{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;
}
.attachrow a{font-size:.85rem;word-break:break-all;min-width:0}
.attachrow .attachdel{flex:none;color:var(--s-pausiert);background:transparent;border:none;cursor:pointer;font-size:.9rem;padding:2px 4px}
.attachrow .attachdel:hover{text-decoration:underline}
.uploadrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.uploadrow input[type=file]{font-size:.8rem;color:var(--muted);max-width:100%}
.uploadmsg{font-size:.78rem;color:var(--muted);margin:6px 0 0}
.uploadmsg.err{color:var(--s-pausiert)}

.steplist{display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
/*
  Jede Idee, die sich in mehrere Antwortzweige aufspaltet, wird zu mehreren
  .chatbox-Bloecken (einer je Zweig) statt einem gemeinsamen Baum - siehe
  buildChatSegments(). Innerhalb eines Blocks ist die Konversation immer
  linear (keine Verschachtelung mehr noetig), deshalb reicht links/rechts
  wie in einem Messenger: Patrick links, Claude rechts. Das loest das
  Problem frueherer Versionen (immer schmalere Spalte bei tiefen Antwort-
  ketten) an der Wurzel, weil hier gar nicht mehr eingerueckt wird.
*/
.chatbox{
  background:var(--sand-dim);border:2px solid var(--sand);border-radius:10px;
  padding:12px;display:flex;flex-direction:column;gap:10px;
}
.chatboxhead{display:flex;justify-content:flex-end}
.chatcollapse-toggle{
  background:transparent;border:none;color:var(--sand);font-size:.76rem;
  cursor:pointer;padding:2px 0;width:fit-content;
}
.chatcollapse-toggle:hover{text-decoration:underline}
.chatmessages{display:flex;flex-direction:column;gap:8px}
.bubblerow{display:flex;flex-direction:column;max-width:82%}
.bubblerow.left{align-self:flex-start;align-items:flex-start}
.bubblerow.right{align-self:flex-end;align-items:flex-end}
.bubble{
  display:flex;align-items:flex-start;gap:8px;border-radius:12px;padding:8px 10px;
  min-width:0;
}
.bubble.patrick{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:3px}
.bubble.claude{background:var(--accent-dim);border:1px solid var(--accent);border-bottom-right-radius:3px}
.bubble.done{opacity:.6}
.bubblelabel{font-size:.68rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0 4px 2px}
.bubblets{font-size:.68rem;color:var(--muted);margin:2px 4px 0}
.stepcheck{flex:none;padding-top:2px}
.stepcheck input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.stepmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.steptext{font-size:.9rem;line-height:1.5;word-wrap:break-word;cursor:text}
.steptext:hover{color:var(--accent)}
.steptext.done{text-decoration:line-through;color:var(--muted)}
.stepattaches{display:flex;flex-wrap:wrap;gap:6px}
.stepattach{
  display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--border);
  border-radius:6px;padding:3px 7px;font-size:.74rem;
}
.stepattach a{word-break:break-all}
.stepattach .attachdel{font-size:.8rem}
.stepfilelabel{
  display:inline-flex;align-items:center;gap:4px;font-size:.74rem;color:var(--muted);
  cursor:pointer;width:fit-content;
}
.stepfilelabel:hover{color:var(--accent)}
.stepdel{flex:none;background:transparent;border:none;color:var(--s-pausiert);cursor:pointer;font-size:1rem;padding:2px 4px;line-height:1}
.stepdel:hover{text-decoration:underline}
.newsteprow{display:flex;gap:8px;flex-wrap:wrap}
.newsteprow input{flex:1;min-width:160px}
.composerrow{display:flex;gap:8px;flex-wrap:wrap}
.composerrow input{flex:1;min-width:160px;font-size:.86rem}

.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px;max-width:360px;width:100%}
.loginbox h1{font-size:1.1rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}
.loginbox .sub{color:var(--muted);font-size:.8rem;margin:0 0 20px}
.loginerr{color:var(--s-pausiert);font-size:.82rem;margin:10px 0 0;min-height:1.2em}

[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div id="loginview" class="loginwrap" hidden>
  <div class="loginbox">
    <h1>Leitstand</h1>
    <p class="sub">Anmeldung mit PocketBase-Zugangsdaten</p>
    <form id="loginForm">
      <div class="formrow"><input class="textin" id="loginEmail" type="email" placeholder="E-Mail" autocomplete="username" required></div>
      <div class="formrow" style="margin-top:10px"><input class="textin" id="loginPassword" type="password" placeholder="Passwort" autocomplete="current-password" required></div>
      <button class="primary" type="submit" style="width:100%;margin-top:16px" id="loginSubmit">Anmelden</button>
      <p class="loginerr" id="loginErr"></p>
    </form>
  </div>
</div>

<div id="appview" hidden>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Leitstand</h1>
        <p class="sub">Projektübersicht &amp; Stand</p>
      </div>
    </div>
    <div class="topright">
      <div class="clock" id="clock">— —</div>
      <button class="ghost small" id="btnLogout">Abmelden</button>
    </div>
  </div>

  <div id="offline" class="offline" hidden>Keine Verbindung zu PocketBase — Ansicht ist nicht aktuell.</div>

  <div id="listview">
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <h2>Projekte</h2>
      <button class="primary" id="btnNew">+ Neues Projekt</button>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <b>Noch kein Projekt erfasst.</b>
      Lege das erste an — Stand und nächste Schritte lassen sich jederzeit nachtragen.
    </div>
  </div>

  <div id="detailview" hidden></div>
</div>
</div>

<script>
(function(){
  const PB_URL = 'https://pb.ascensus.fit';
  const AUTH_COLLECTION = 'api_clients';
  const DATA_COLLECTION = 'projekte';
  const STEPS_COLLECTION = 'projekt_schritte';
  const AUTH_STORAGE_KEY = 'leitstand_pb_auth';
  const POLL_MS = 25000;

  const STATUS = {
    offen:              {label:'Offen',               css:'--s-offen'},
    in_arbeit:          {label:'In Arbeit',            css:'--s-arbeit'},
    wartet_auf_freigabe:{label:'Wartet auf Freigabe',  css:'--s-wartet'},
    erledigt:           {label:'Erledigt',             css:'--s-erledigt'},
    pausiert:           {label:'Pausiert',             css:'--s-pausiert'}
  };
  const STATUS_ORDER = ['offen','in_arbeit','wartet_auf_freigabe','erledigt','pausiert'];

  const loginview = document.getElementById('loginview');
  const appview = document.getElementById('appview');
  const loginForm = document.getElementById('loginForm');
  const loginErr = document.getElementById('loginErr');
  const loginSubmit = document.getElementById('loginSubmit');
  const btnLogout = document.getElementById('btnLogout');

  const listview = document.getElementById('listview');
  const detailview = document.getElementById('detailview');
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const statsEl = document.getElementById('stats');
  const offlineEl = document.getElementById('offline');
  const btnNew = document.getElementById('btnNew');
  const clockEl = document.getElementById('clock');

  let docs = [];
  let stepsByProject = {};
  let loaded = false;
  let showNewForm = false;
  let detailEditing = false;
  let detailConfirmingDelete = false;
  const editingStepIds = new Set();
  // IDs der jeweils ersten Nachricht eines Chat-Segments, dessen Box bis
  // zur Ausgangsfrage eingeklappt ist (manuell umgeschaltet).
  const chatboxCollapsed = new Set();
  let inputsFocused = 0; // zaehlt fokussierte/aktive Eingabefelder im Detail - waehrend >0 unterdrueckt Polling das Neuzeichnen
  let authToken = null;
  let pollHandle = null;

  // ---------- helpers ----------
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtTs(iso){
    if(!iso) return '—';
    try{
      const d = new Date(iso);
      return d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
    }catch(e){ return '—'; }
  }
  function nowIso(){ return new Date().toISOString(); }
  function splitBullets(text){
    let items = String(text||'').split('\n').map(s=>s.trim()).filter(Boolean);
    if(items.length<=1){
      const single = items[0] || '';
      if(single.indexOf(' · ')!==-1){
        items = single.split(' · ').map(s=>s.trim()).filter(Boolean);
      }
    }
    return items;
  }
  function bulletsHtml(text, limit, emptyHint){
    const items = splitBullets(text);
    if(!items.length) return '<p class="empty-hint">'+esc(emptyHint||'Noch nichts erfasst.')+'</p>';
    const shown = limit ? items.slice(0, limit) : items;
    let html = '<ul class="bullets">'+shown.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>';
    if(limit && items.length>limit){
      html += '<p class="more">+'+(items.length-limit)+' weitere</p>';
    }
    return html;
  }
  function openDetail(id){ location.hash = id; }
  function closeDetail(){ history.length>1 ? history.back() : (location.hash=''); }
  function currentId(){
    const h = location.hash.replace(/^#/,'');
    return h || null;
  }
  function stepsFor(projectId){
    return stepsByProject[projectId] || [];
  }
  // Baut aus der flachen Schritte-Liste einen Baum: jeder Schritt bekommt
  // ein .replies-Array mit den Schritten, deren antwort_auf auf ihn zeigt.
  // Unterstuetzt beliebige Tiefe, auch wenn die Oberflaeche aktuell nur
  // eine Ebene gezielt gestaltet.
  function buildStepTree(steps){
    const byId = {};
    steps.forEach(s=>{ byId[s.id] = Object.assign({}, s, {replies: []}); });
    const top = [];
    steps.forEach(s=>{
      const node = byId[s.id];
      if(s.antwort_auf && byId[s.antwort_auf]){
        byId[s.antwort_auf].replies.push(node);
      } else {
        top.push(node);
      }
    });
    return top;
  }

  // ---------- auth storage ----------
  function loadAuth(){
    try{
      const raw = localStorage.getItem(AUTH_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveAuth(token, record){
    try{ localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({token, record})); }catch(e){}
  }
  function clearAuth(){
    try{ localStorage.removeItem(AUTH_STORAGE_KEY); }catch(e){}
  }

  // ---------- PocketBase client (collection-generic) ----------
  async function pbRaw(path, opts){
    opts = opts || {};
    const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
    if(authToken) headers['Authorization'] = authToken; // dieser Server erwartet den Token pur, ohne "Bearer"
    const res = await fetch(PB_URL+path, Object.assign({}, opts, {headers}));
    let data = null;
    try{ data = await res.json(); }catch(e){}
    return {status: res.status, data};
  }
  async function pbLogin(identity, password){
    const r = await pbRaw('/api/collections/'+AUTH_COLLECTION+'/auth-with-password', {
      method:'POST', body: JSON.stringify({identity, password})
    });
    if(r.status===200 && r.data && r.data.token){
      authToken = r.data.token;
      saveAuth(r.data.token, r.data.record);
      return true;
    }
    return false;
  }
  async function pbRefresh(){
    const r = await pbRaw('/api/collections/'+AUTH_COLLECTION+'/auth-refresh', {method:'POST'});
    if(r.status===200 && r.data && r.data.token){
      authToken = r.data.token;
      saveAuth(r.data.token, r.data.record);
      return true;
    }
    return false;
  }
  async function pbList(collection, query){
    const r = await pbRaw('/api/collections/'+collection+'/records'+(query||''));
    if(r.status===401){ onAuthLost(); return null; }
    if(r.status!==200 || !r.data) return null;
    return r.data.items || [];
  }
  async function pbCreate(collection, fields){
    const r = await pbRaw('/api/collections/'+collection+'/records', {method:'POST', body:JSON.stringify(fields)});
    if(r.status===401){ onAuthLost(); return null; }
    return (r.status===200||r.status===201) ? r.data : null;
  }
  async function pbUpdate(collection, id, fields){
    const r = await pbRaw('/api/collections/'+collection+'/records/'+id, {method:'PATCH', body:JSON.stringify(fields)});
    if(r.status===401){ onAuthLost(); return null; }
    return (r.status===200||r.status===201) ? r.data : null;
  }
  async function pbDelete(collection, id){
    const r = await pbRaw('/api/collections/'+collection+'/records/'+id, {method:'DELETE'});
    if(r.status===401){ onAuthLost(); return false; }
    return r.status===204 || r.status===200;
  }
  function attachmentUrl(collection, recordId, filename){
    return PB_URL+'/api/files/'+collection+'/'+recordId+'/'+encodeURIComponent(filename);
  }
  // Datei-Upload braucht multipart/form-data statt JSON, deshalb kein
  // pbRaw() hier (das setzt immer Content-Type: application/json) - der
  // Browser muss die Boundary fuer FormData selbst setzen koennen.
  async function pbUploadFile(collection, id, field, file){
    const fd = new FormData();
    fd.append(field, file);
    const headers = {};
    if(authToken) headers['Authorization'] = authToken;
    const res = await fetch(PB_URL+'/api/collections/'+collection+'/records/'+id, {method:'PATCH', headers, body:fd});
    if(res.status===401){ onAuthLost(); return null; }
    if(res.status!==200 && res.status!==201) return null;
    try{ return await res.json(); }catch(e){ return null; }
  }
  async function pbDeleteFile(collection, id, field, filename){
    const fd = new FormData();
    fd.append(field+'-', filename); // PocketBase-Syntax: "<feld>-" entfernt diese eine Datei aus dem Mehrfach-Dateifeld
    const headers = {};
    if(authToken) headers['Authorization'] = authToken;
    const res = await fetch(PB_URL+'/api/collections/'+collection+'/records/'+id, {method:'PATCH', headers, body:fd});
    if(res.status===401){ onAuthLost(); return false; }
    return res.status===200 || res.status===201;
  }

  // Zerlegt den Schritt-Baum eines Projekts in Chat-Segmente: jedes Segment
  // ist eine chronologische Liste von Schritten, die ununterbrochen
  // aufeinander antworten (0 oder 1 Antwort pro Ebene). Hat ein Schritt
  // mehrere Antworten (eine Idee, aus der mehrere Varianten wurden, z.B.
  // "Post 1/2/3"), endet das laufende Segment dort und jede Antwort startet
  // ein eigenes neues Segment, das mit demselben verzweigenden Schritt
  // beginnt (als gemeinsamer Ausgangspunkt/Kontext) - so bleibt jeder
  // Gesprächsfaden fuer sich lesbar, statt alle Varianten in einer
  // Chronologie zu vermischen (das war explizit der Punkt: eine
  // durchgehende Chronologie ueber mehrere unabhaengige Ideen hinweg
  // springt staendig zwischen Themen).
  function buildChatSegments(topLevelSteps){
    const segments = [];
    function walk(step, carried){
      const messages = carried.concat([step]);
      const children = Array.isArray(step.replies) ? step.replies : [];
      if(children.length<=1){
        if(children.length===1){
          walk(children[0], messages);
        } else {
          segments.push(messages);
        }
      } else {
        // Nur als eigenes Segment sichern, wenn vor der Verzweigung schon
        // ein echtes Gespraech stand - der Verzweigungsschritt allein (z.B.
        // die urspruengliche Idee, aus der direkt mehrere Varianten kamen)
        // wuerde sonst als sinnloses 1-Nachrichten-Segment auftauchen,
        // obwohl er ohnehin als Kontext in jedem der neuen Segmente steht.
        if(messages.length>1) segments.push(messages);
        children.forEach(child=> walk(child, [step]));
      }
    }
    topLevelSteps.forEach(s=> walk(s, []));
    return segments;
  }

  function renderDetail(id){
    const d = docs.find(x=>x.id===id);
    if(!d){
      if(loaded){ location.hash=''; }
      return;
    }
    detailview.innerHTML = detailEditing ? detailEditHtml(d) : detailViewHtml(d);
    document.getElementById('backBtn').onclick = closeDetail;
    if(detailEditing){
      const edStand = document.getElementById('edStand');
      edStand.addEventListener('focus', ()=>inputsFocused++);
      edStand.addEventListener('blur', ()=>inputsFocused--);
      document.getElementById('edCancel').onclick = ()=>{ detailEditing=false; renderDetail(id); };
      document.getElementById('edSave').onclick = ()=>{
        const name = (document.getElementById('edName').value||'').trim();
        const stand = document.getElementById('edStand').value||'';
        if(!name) return;
        updateDoc(id, {name, stand}, true);
      };
      return;
    }
    // ---- Status, Claude-Markierung, projektweite Anhaenge ----
    const statusSel = document.getElementById('detStatus');
    if(statusSel) statusSel.onchange = ()=> updateDoc(id, {status: statusSel.value});
    const bcs = document.getElementById('btnClaudeSend');
    if(bcs) bcs.onclick = ()=> updateDoc(id, {claude_auftrag: nowIso()});
    const bcc = document.getElementById('btnClaudeClear');
    if(bcc) bcc.onclick = ()=> updateDoc(id, {claude_auftrag: null});
    const attachInput = document.getElementById('attachInput');
    const attachUpload = document.getElementById('attachUpload');
    const attachMsg = document.getElementById('attachMsg');
    if(attachUpload) attachUpload.onclick = async ()=>{
      const file = attachInput && attachInput.files && attachInput.files[0];
      if(!file) return;
      attachUpload.disabled = true;
      attachMsg.className = 'uploadmsg';
      attachMsg.textContent = 'Lädt hoch …';
      const rec = await pbUploadFile(DATA_COLLECTION, id, 'anhaenge', file);
      attachUpload.disabled = false;
      if(rec){
        await refreshData(true, true);
      } else {
        attachMsg.className = 'uploadmsg err';
        attachMsg.textContent = 'Upload fehlgeschlagen — bitte erneut versuchen.';
      }
    };
    detailview.querySelectorAll('[data-act="attachdel"]').forEach(el=>{
      el.onclick = async ()=>{
        const fn = el.getAttribute('data-file');
        const ok = await pbDeleteFile(DATA_COLLECTION, id, 'anhaenge', fn);
        if(ok) await refreshData(true, true);
      };
    });
    if(detailConfirmingDelete){
      document.getElementById('delConfirm').onclick = ()=> deleteDoc(id);
      document.getElementById('delCancel').onclick = ()=>{ detailConfirmingDelete=false; renderDetail(id); };
    } else {
      const be = document.getElementById('btnEdit');
      const bd = document.getElementById('btnDelAsk');
      if(be) be.onclick = ()=>{ detailEditing=true; renderDetail(id); };
      if(bd) bd.onclick = ()=>{ detailConfirmingDelete=true; renderDetail(id); };
    }

    // ---- Naechste-Schritte-Zeilen ----
    const newStepInput = document.getElementById('newStepText');
    const addStep = ()=>{
      const text = (newStepInput.value||'').trim();
      if(!text) return;
      createStep(id, text);
    };
    newStepInput.addEventListener('focus', ()=>inputsFocused++);
    newStepInput.addEventListener('blur', ()=>inputsFocused--);
    newStepInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addStep(); } });
    document.getElementById('btnAddStep').onclick = addStep;

    detailview.querySelectorAll('[data-act="stepdone"]').forEach(el=>{
      el.onchange = ()=> updateStep(el.getAttribute('data-step'), {erledigt: el.checked});
    });
    detailview.querySelectorAll('[data-act="stepedit"]').forEach(el=>{
      el.onclick = ()=>{
        editingStepIds.add(el.getAttribute('data-step'));
        renderDetail(id);
      };
    });
    detailview.querySelectorAll('input[id^="stepedit-"]').forEach(el=>{
      const sid = el.id.replace('stepedit-','');
      el.addEventListener('focus', ()=>inputsFocused++);
      el.addEventListener('blur', ()=>inputsFocused--);
      const save = ()=>{
        const text = (el.value||'').trim();
        editingStepIds.delete(sid);
        if(text) updateStep(sid, {text});
        else renderDetail(id);
      };
      el.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){ e.preventDefault(); save(); }
        if(e.key==='Escape'){ editingStepIds.delete(sid); renderDetail(id); }
      });
      el.addEventListener('blur', save);
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });
    detailview.querySelectorAll('[data-act="stepdel"]').forEach(el=>{
      el.onclick = ()=> deleteStep(el.getAttribute('data-step'));
    });
    detailview.querySelectorAll('[data-act="stepfile"]').forEach(el=>{
      el.onchange = async ()=>{
        const sid = el.getAttribute('data-step');
        const file = el.files && el.files[0];
        if(!file) return;
        const rec = await pbUploadFile(STEPS_COLLECTION, sid, 'anhaenge', file);
        if(rec) await refreshData(true, true);
      };
    });
    detailview.querySelectorAll('[data-act="stepattachdel"]').forEach(el=>{
      el.onclick = async ()=>{
        const sid = el.getAttribute('data-step');
        const fn = el.getAttribute('data-file');
        const ok = await pbDeleteFile(STEPS_COLLECTION, sid, 'anhaenge', fn);
        if(ok) await refreshData(true, true);
      };
    });
    // ---- Chat-Composer je Segment (eine Zeile am Ende jeder .chatbox) ----
    detailview.querySelectorAll('input[id^="composer-"]').forEach(el=>{
      const parentId = el.id.replace('composer-','');
      el.addEventListener('focus', ()=>inputsFocused++);
      el.addEventListener('blur', ()=>inputsFocused--);
      const send = ()=>{
        const text = (el.value||'').trim();
        if(text) createStep(id, text, parentId);
      };
      el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });
      const btn = detailview.querySelector('[data-act="composersend"][data-parent="'+parentId+'"]');
      if(btn) btn.onclick = send;
    });
    detailview.querySelectorAll('[data-act="chatcollapse"]').forEach(el=>{
      el.onclick = ()=>{
        const boxId = el.getAttribute('data-box');
        if(chatboxCollapsed.has(boxId)) chatboxCollapsed.delete(boxId);
        else chatboxCollapsed.add(boxId);
        renderDetail(id);
      };
    });
  }
  function render(){
    const id = currentId();
    if(id){
      listview.hidden = true;
      detailview.hidden = false;
      renderDetail(id);
    } else {
      detailview.hidden = true;
      listview.hidden = false;
      detailEditing = false;
      detailConfirmingDelete = false;
      editingStepIds.clear();
      chatboxCollapsed.clear();
      inputsFocused = 0;
      renderList();
    }
  }
  window.addEventListener('hashchange', render);

  // ---------- data flow ----------
  async function refreshData(silent, forceRender){
    const [projects, steps] = await Promise.all([
      pbList(DATA_COLLECTION, '?sort=-aktualisiert&perPage=200'),
      pbList(STEPS_COLLECTION, '?sort=erstellt&perPage=1000')
    ]);
    if(projects===null || steps===null){
      if(!silent) offlineEl.hidden = false;
      return false;
    }
    offlineEl.hidden = true;
    docs = projects;
    const grouped = {};
    steps.forEach(s=>{
      const pid = s.projekt;
      (grouped[pid] = grouped[pid]||[]).push(s);
    });
    stepsByProject = grouped;
    loaded = true;
    // Waehrend ein Formular offen ist (Neuanlage, Projekt-Bearbeiten, ein
    // Schritt wird gerade benannt oder editiert), darf eine Hintergrund-
    // Aktualisierung (Polling) die Eingabe nicht wegreissen - sonst
    // verschwindet gerade Diktiertes mitten im Tippen.
    if(forceRender || !(showNewForm || detailEditing || inputsFocused>0)){
      render();
    }
    return true;
  }
  function startPolling(){
    stopPolling();
    pollHandle = setInterval(()=>refreshData(true), POLL_MS);
  }
  function stopPolling(){
    if(pollHandle){ clearInterval(pollHandle); pollHandle=null; }
  }

  async function createProject(){
    const name = (document.getElementById('newName').value||'').trim();
    const stand = document.getElementById('newStand').value||'';
    if(!name) return;
    const rec = await pbCreate(DATA_COLLECTION, {name, stand, status:'offen', erstellt: nowIso(), aktualisiert: nowIso(), quelle:'leitstand'});
    if(rec){
      showNewForm = false;
      await refreshData(true, true);
      openDetail(rec.id);
    }
  }
  async function updateDoc(id, patch, exitEdit){
    const rec = await pbUpdate(DATA_COLLECTION, id, Object.assign({}, patch, {aktualisiert: nowIso()}));
    if(rec){
      if(exitEdit) detailEditing = false;
      await refreshData(true, true);
    } else {
      render();
    }
  }
  async function deleteDoc(id){
    const ok = await pbDelete(DATA_COLLECTION, id);
    detailConfirmingDelete = false;
    if(ok) await refreshData(true);
    closeDetail();
  }
  async function createStep(projectId, text, parentStepId){
    const fields = {
      // Jeder Schritt, der hier aus der Web-UI entsteht, ist per Definition
      // von Patrick - Claude schreibt ausschliesslich ueber den
      // MCP-Connector bzw. die Skill-eigene PocketBase-Anbindung, nie über
      // diese Oberflaeche.
      projekt: projectId, text, erledigt: false, autor: 'patrick',
      erstellt: nowIso(), aktualisiert: nowIso()
    };
    if(parentStepId) fields.antwort_auf = parentStepId;
    const rec = await pbCreate(STEPS_COLLECTION, fields);
    if(rec) await refreshData(true, true);
  }
  async function updateStep(stepId, patch){
    const rec = await pbUpdate(STEPS_COLLECTION, stepId, Object.assign({}, patch, {aktualisiert: nowIso()}));
    if(rec) await refreshData(true, true);
    else render();
  }
  async function deleteStep(stepId){
    const ok = await pbDelete(STEPS_COLLECTION, stepId);
    if(ok) await refreshData(true, true);
  }
  btnNew.onclick = ()=>{ showNewForm = true; renderList(); };

  // ---------- boot ----------
  async function bootApp(){
    showApp();
    await refreshData(false);
    startPolling();
  }
  async function init(){
    const stored = loadAuth();
    if(stored && stored.token){
      authToken = stored.token;
      const ok = await pbRefresh().catch(()=>false);
      if(ok){ await bootApp(); return; }
      authToken = null;
      clearAuth();
    }
    showLogin();
  }
  init();
})();
</script>
</body>
